[package]
name = "lv2render"
version = "0.1.0"
edition = "2021"
description = "A high-performance, CLI-based offline audio processor for LV2 plugins"

[dependencies]
clap = { version = "4", features = ["derive"] }
livi = "0.4"
symphonia = { version = "0.5", features = ["all"] }
hound = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9" # Deprecated, but kept for now as replacements are immature
